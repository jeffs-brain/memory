# SPDX-License-Identifier: Apache-2.0
version: "2"
run:
  timeout: 5m
  go: '1.25'
formatters:
  enable:
    - gofmt
    - goimports
linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - misspell
    - unconvert
  disable:
    - unparam
    - unused
  settings:
    misspell:
      locale: UK
      ignore-rules:
        # US spellings in regex patterns matching both UK/US variants
        - naturalization
        - counselor
        - pediatrician
        - gynecologist
        - participat
        - cozy
        # US spellings in LLM prompt text (must not change model instructions)
        - penalize
        - personalized
        - moisturizer
        - organize
        # HTTP standard terms
        - unauthorized
        # CLI flag names (de facto standard)
        - color
        # Go crypto library upstream term
        - armored
        # US English terms used as internal reason codes / string constants
        - artifact
        - normalized
        - categorized
        - center
        - Initializing
        - behavior
        - distill
        - Distill
        # LLM prompt content - cannot change
        - utilizes
    staticcheck:
      checks:
        - "all"
        - "-ST1000"
        - "-ST1018"
        - "-ST1023"
        - "-QF1012"
        - "-QF1001"
        - "-QF1003"
        - "-S1011"
        - "-S1017"
        - "-S1007"
        - "-SA9003"
        - "-SA2001"
        - "-SA4006"
  exclusions:
    paths:
      - testdata
      - vendor
    rules:
      - path: _test\.go
        linters:
          - errcheck
