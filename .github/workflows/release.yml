# SPDX-License-Identifier: Apache-2.0
#
# Publishes only from a release tag. `v*` tags publish the npm packages
# and must match @jeffs-brain/memory's version; `go/v*` tags release the
# Go module. Both must match the Go CLI version. A workflow_dispatch run
# against a tag ref republishes; against a branch it runs every gate and
# publishes nothing. Every gate blocks: nothing ships red.
name: release
on:
  push:
    tags: ['v*', 'go/v*']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true
          cache: true
          cache-dependency-path: go/go.sum
      - name: Check Go CLI version matches release tag
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/go/v')
        run: |
          tag="${GITHUB_REF_NAME#go/v}"
          tag="${tag#v}"
          got="$(go run ./cmd/memory version)"
          if [ "$got" != "$tag" ]; then
            echo "Go CLI version $got does not match release tag $tag"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  publish-ts:
    needs: check-go
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Check @jeffs-brain/memory version matches release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          got="$(node -p "require('./sdks/ts/memory/package.json').version")"
          if [ "$got" != "$tag" ]; then
            echo "@jeffs-brain/memory version $got does not match release tag $tag"
            exit 1
          fi
      - name: Install ffmpeg for the media extractor tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Configure git identity for integration tests
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Publish @jeffs-brain/memory
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/publish-if-needed.sh sdks/ts/memory
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @jeffs-brain/memory-pi
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/publish-if-needed.sh sdks/ts/memory-pi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @jeffs-brain/memory-postgres
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/publish-if-needed.sh sdks/ts/memory-postgres
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @jeffs-brain/memory-openfga
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/publish-if-needed.sh sdks/ts/memory-openfga
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @jeffs-brain/memory-mcp
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/publish-if-needed.sh mcp/ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @jeffs-brain/install
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/publish-if-needed.sh install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          generate_release_notes: true

  release-go:
    needs: check-go
    if: startsWith(github.ref, 'refs/tags/go/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
