# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install ffmpeg for the media extractor tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Configure git identity for integration tests
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck (sources and tests)
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Every publishable package has its entry point
        run: |
          status=0
          for dir in sdks/ts/memory sdks/ts/memory-postgres sdks/ts/memory-openfga sdks/ts/memory-pi mcp/ts install; do
            main="$(node -p "require('./$dir/package.json').main")"
            if [ ! -f "$dir/$main" ]; then
              echo "::error::$dir: entry point $main was not built"
              status=1
            fi
          done
          exit $status

  python:
    name: Python ${{ matrix.python }} (${{ matrix.project }})
    strategy:
      fail-fast: false
      matrix:
        project: [sdks/py, mcp/py]
        python: ['3.11', '3.13']
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy src
      - name: Test
        run: uv run pytest -q

  eval:
    name: Eval harness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eval
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest -q

  docs:
    name: Docs site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
